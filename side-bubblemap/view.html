<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2022 개정 수학과 × SIDE 사고체계 버블맵</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f6fb}
#appFrame{display:block;width:100%;height:100%;border:0;background:#f3f6fb}
</style>
</head>
<body>
<iframe id="appFrame" src="index.html?v=20260912-rootfix" title="수학×SIDE 버블맵"></iframe>
<script>
(function(){
  const frame=document.getElementById('appFrame');
  function fixRoot(){
    try{
      const d=frame.contentDocument;
      if(!d) return;
      const svg=d.getElementById('svg');
      if(!svg) return;
      const groups=[...svg.querySelectorAll('g.node')];
      let root=groups.find(g=>{
        const c=[...g.children].find(el=>el.tagName&&el.tagName.toLowerCase()==='circle');
        if(!c) return false;
        const fill=(c.getAttribute('fill')||'').toLowerCase().replace(/\s/g,'');
        return fill==='#172033'||fill==='rgb(23,32,51)'||fill==='var(--ink)';
      });
      if(!root){
        root=groups.find(g=>[...g.querySelectorAll('text')].some(t=>(t.textContent||'').trim()==='미래수학역량'));
      }
      if(!root) return;
      const circle=[...root.children].find(el=>el.tagName&&el.tagName.toLowerCase()==='circle');
      if(circle){ circle.setAttribute('r','72'); circle.style.filter='drop-shadow(0 8px 14px rgba(15,23,42,.16))'; }
      let label=[...root.children].find(el=>el.tagName&&el.tagName.toLowerCase()==='text'&&!el.classList.contains('sub'));
      if(!label){ label=d.createElementNS('http://www.w3.org/2000/svg','text'); root.appendChild(label); }
      label.textContent='미래수학역량';
      label.setAttribute('x','0'); label.setAttribute('y','25');
      label.setAttribute('text-anchor','middle');
      label.setAttribute('font-size','16');
      label.setAttribute('font-weight','900');
      label.setAttribute('fill','#ffffff');
      label.style.fill='#ffffff'; label.style.fontWeight='900'; label.style.pointerEvents='none';
      label.classList.add('root-label');
      const directGs=[...root.children].filter(el=>el.tagName&&el.tagName.toLowerCase()==='g');
      directGs.forEach(g=>{
        const html=g.outerHTML||'';
        if(html.includes('path')||html.includes('circle')||html.includes('rect')){
          const tr=g.getAttribute('transform')||'';
          if(!tr.includes('translate(0 -40)')) g.setAttribute('transform','translate(0 -40) scale(1.25)');
        }
      });
    }catch(e){}
  }
  frame.addEventListener('load',()=>{
    fixRoot();
    try{
      const d=frame.contentDocument;
      const svg=d&&d.getElementById('svg');
      if(svg){ new MutationObserver(fixRoot).observe(svg,{childList:true,subtree:true}); }
    }catch(e){}
  });
  setInterval(fixRoot,500);
})();
</script>
</body>
</html>
