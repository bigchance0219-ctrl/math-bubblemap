<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIDE 수학적 사고 × 교육과정 × 디지털 도구</title>
<style>html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:#f4f7fb}#loading{height:100%;display:grid;place-items:center;color:#475467;font-weight:800;text-align:center;padding:24px}</style>
</head>
<body>
<div id="loading">SIDE 수학적 사고 교육과정 분석 사이트를 불러오는 중입니다…</div>
<script>
(async()=>{
 try{
  const r=await fetch('site-v2.gz.b64?v=2',{cache:'no-store'});
  if(!r.ok) throw new Error('사이트 데이터 불러오기 실패 ('+r.status+')');
  const b64=(await r.text()).replace(/\s+/g,'');
  const bin=atob(b64); const gz=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) gz[i]=bin.charCodeAt(i);
  if(typeof DecompressionStream==='undefined') throw new Error('Chrome 또는 Edge 최신 버전에서 열어 주세요.');
  const stream=new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  if(!html.includes('초등 수학 121개 성취기준')) throw new Error('사이트 데이터 확인에 실패했습니다.');
  document.open();document.write(html);document.close();
 }catch(e){document.body.innerHTML='<pre style="white-space:pre-wrap;padding:20px">불러오기 오류: '+String(e)+'\n새로고침 후 다시 시도해 주세요.</pre>';}
})();
</script>
</body>
</html>
