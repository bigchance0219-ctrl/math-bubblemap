<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>초등 수학 교육과정 통합 버블맵 PRO</title>
<style>html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:#f4f7fb}#loading{height:100%;display:grid;place-items:center;color:#475467;font-weight:700}</style>
</head>
<body>
<div id="loading">초등 수학 교육과정 통합 버블맵 PRO를 불러오는 중입니다…</div>
<script>
(async()=>{
 try{
  const urls=['data/part1.txt','data/part2.txt','data/part3.txt','data/part4.txt','data/part5.txt'];
  const chunks=[];
  for(const u of urls){
    const r=await fetch(u,{cache:'no-store'});
    if(!r.ok) throw new Error(u+' 불러오기 실패 ('+r.status+')');
    const b64=(await r.text()).replace(/\s+/g,'');
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    chunks.push(bytes);
  }
  const total=chunks.reduce((n,a)=>n+a.length,0);
  const gz=new Uint8Array(total);
  let offset=0;
  for(const a of chunks){gz.set(a,offset);offset+=a.length;}
  if(typeof DecompressionStream==='undefined') throw new Error('이 브라우저는 압축 해제를 지원하지 않습니다. Chrome 또는 Edge 최신 버전에서 열어 주세요.');
  const stream=new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  if(!html.includes('초등 수학 교육과정 통합 버블맵 PRO')) throw new Error('원본 PRO 데이터 확인에 실패했습니다.');
  const upgraded=html.replace('</body>','<script src="v11.js?v=11"></'+'script><script src="v12.js?v=12"></'+'script><script src="v13.js?v=13"></'+'script><script src="v14.js?v=14"></'+'script><script src="v15.js?v=15"></'+'script></body>');
  document.open();document.write(upgraded);document.close();
 }catch(e){
   document.body.innerHTML='<pre style="white-space:pre-wrap;padding:20px;font-family:sans-serif">불러오기 오류: '+String(e)+'\n\n새로고침 후에도 계속되면 Chrome/Edge에서 다시 열어 주세요.</pre>';
 }
})();
</script>
</body>
</html>
